<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register | KrishiMitra AI</title>

  <!-- CSS -->

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

  <section class="auth-page">

    <div class="auth-container glass-card fade-in">

      <!-- LEFT -->

      <div class="auth-left">

        <div class="auth-left-content">

          <span class="hero-badge">
            Join KrishiMitra AI
          </span>

          <h1>
            Build Smarter Farming With AI
          </h1>

          <p>

            Create your account and start using AI-driven
            agriculture intelligence for better crop planning,
            monitoring, and productivity.

          </p>

          <img
            src="assets/images/auth-farming.png"
            alt="AI Farming"
            class="auth-image float-animation"
          >

        </div>

      </div>

      <!-- RIGHT -->

      <div class="auth-right">

        <div class="auth-card">

          <div class="auth-header">

            <h2 data-translate="register">
              Register
            </h2>

            <p>
              Create your smart farming account.
            </p>

          </div>

          <!-- FORM -->

          <form class="auth-form" id="registerForm">

            <!-- USERNAME -->

            <div class="form-group">

              <label>Username (3-20 chars: letters, numbers, _)</label>

              <input
                type="text"
                id="username"
                name="username"
                class="form-input"
                placeholder="e.g. farmer_rajesh"
                required
              >

            </div>

            <!-- NAME -->

            <div class="form-group">

              <label>Full Name</label>

              <input
                type="text"
                id="name"
                class="form-input"
                placeholder="Enter your full name"
                required
              >

            </div>

            <!-- PHONE -->

            <div class="form-group">

              <label>Phone Number (10 digits)</label>

              <input
                type="tel"
                id="phone"
                class="form-input"
                placeholder="e.g. 9876543210"
                required
              >

            </div>

            <!-- EMAIL -->

            <div class="form-group">

              <label>Email Address</label>

              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="Enter your email (e.g. farmer@example.com)"
                required
              >

            </div>

            <!-- PASSWORD -->

            <div class="form-group">

              <label>Password (min 6 chars, letters & numbers)</label>

              <div class="input-wrapper">

                <input
                  type="password"
                  id="password"
                  class="form-input password-input"
                  placeholder="Create strong password"
                  required
                >

                <span
                  class="password-toggle"
                  onclick="togglePassword(this)"
                >
                  👁️
                </span>

              </div>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn-primary">

              Create Account

            </button>

          </form>

          <!-- FOOTER -->

          <p class="auth-footer-text">

            Already have an account?

            <a
              href="login.html"
              class="auth-link"
            >
              Login Here
            </a>

          </p>

        </div>

      </div>

    </div>

  </section>

  <!-- JS -->

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
