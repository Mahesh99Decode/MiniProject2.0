<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | KrishiMitra AI</title>

  <!-- CSS -->

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

  <section class="auth-page">

    <div class="auth-container glass-card fade-in">

      <!-- LEFT -->

      <div class="auth-left">

        <div class="auth-left-content">

          <span class="hero-badge">
            Welcome Back
          </span>

          <h1>
            Smart Farming Begins With AI
          </h1>

          <p>

            Access your AI-powered agriculture dashboard,
            crop insights, weather analysis, and smart
            farming recommendations.

          </p>

          <img
            src="assets/images/auth-farming.png"
            alt="AI Farming"
            class="auth-image float-animation"
          >

        </div>

      </div>

      <!-- RIGHT -->

      <div class="auth-right">

        <div class="auth-card">

          <div class="auth-header">

            <h2 data-translate="login">
              Login
            </h2>

            <p>
              Access your farming intelligence dashboard.
            </p>

          </div>

          <!-- FORM -->

          <form class="auth-form" id="loginForm">

            <!-- USERNAME OR EMAIL -->

            <div class="form-group">

              <label>Username or Email Address</label>

              <input
                type="text"
                id="email"
                class="form-input"
                placeholder="Enter username (e.g. rajesh_patil) or email"
                required
              >

            </div>

            <!-- PASSWORD -->

            <div class="form-group">

              <label>Password (min 6 chars)</label>

              <div class="input-wrapper">

                <input
                  type="password"
                  id="password"
                  class="form-input password-input"
                  placeholder="Enter your password"
                  required
                >

                <span
                  class="password-toggle"
                  onclick="togglePassword(this)"
                >
                  👁️
                </span>

              </div>

            </div>

            <!-- OPTIONS -->

            <div class="auth-options">

              <label class="remember-me">

                <input type="checkbox">

                Remember Me

              </label>

              <a href="#" class="auth-link">
                Forgot Password?
              </a>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn-primary">

              Login To Dashboard

            </button>

          </form>

          <!-- FOOTER -->

          <p class="auth-footer-text">

            Don’t have an account?

            <a
              href="register.html"
              class="auth-link"
            >
              Register Here
            </a>

          </p>

        </div>

      </div>

    </div>

  </section>

  <!-- JS -->

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
