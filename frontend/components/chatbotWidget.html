<!-- ========================================
     KRISHIMITRA AI CHATBOT
======================================== -->

<div class="chatbot-container">

  <!-- FLOATING BUTTON -->

  <button
    class="chatbot-toggle pulse-glow"
    id="chatbotToggle"
  >
    🤖
  </button>

  <!-- CHAT WINDOW -->

  <div
    class="chatbot-window hidden"
    id="chatbotWindow"
  >

    <!-- HEADER -->

    <div class="chatbot-header">

      <div class="chatbot-header-left">

        <div class="chatbot-avatar">
          🌱
        </div>

        <div>

          <h3>KrishiMitra AI</h3>

          <p>AI Farming Assistant</p>

        </div>

      </div>

      <button
        class="chatbot-close"
        id="chatbotClose"
      >
        ✕
      </button>

    </div>

    <!-- CHAT BODY -->

    <div
      class="chatbot-body"
      id="chatbotBody"
    >

      <!-- AI MESSAGE -->

      <div class="chat-message ai-message">

        <div class="message-avatar">
          🤖
        </div>

        <div class="message-content">

          <p>

            Namaste Farmer 👋<br>

            I am your AI farming assistant.
            How can I help you today?

          </p>

        </div>

      </div>

      <!-- QUICK ACTIONS -->

      <div class="quick-actions">

        <button class="quick-chip">
          🌦️ Weather
        </button>

        <button class="quick-chip">
          🌱 Crop Advice
        </button>

        <button class="quick-chip">
          💧 Irrigation
        </button>

        <button class="quick-chip">
          🦠 Disease Check
        </button>

      </div>

      <!-- TYPING -->

      <div
        class="typing-indicator hidden"
        id="typingIndicator"
      >

        <span></span>
        <span></span>
        <span></span>

      </div>

    </div>

    <!-- INPUT -->

    <div class="chatbot-input-area">

      <input
        type="text"
        id="chatInput"
        placeholder="Ask your farming question..."
      >

      <button
        class="send-btn"
        id="sendBtn"
      >
        ➤
      </button>

    </div>

  </div>

</div>
